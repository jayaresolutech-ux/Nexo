services:
  - type: web
    name: mini-erp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: https://polwremxhouebxrjxpgn.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        value: https://polwremxhouebxrjxpgn.supabase.co/auth/v1/.well-known/jwks.json
