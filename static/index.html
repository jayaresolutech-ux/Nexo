<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexo - Gestão Empresarial</title>
<link rel="icon" type="image/svg+xml" href="nexo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth-screen" hidden></section>
<div id="app">
  <aside id="menu">
    <div class="brand"><img class="brand-ico" src="nexo-icon.svg" alt=""><div><b>nexo</b><small>Gestão empresarial conectada</small></div></div>
    <nav id="nav"></nav>
    <div class="menu-foot">
      <button class="btn-sair" id="fechar-sistema" title="Desliga o Nexo com segurança"><span class="ico-sair">⏻</span><span class="t"> Fechar sistema</span></button>
      <div>v1.0 · sistema de gestão</div>
    </div>
  </aside>
  <main>
    <header id="topbar">
      <div><div class="top-title">NEXO - GESTÃO EMPRESARIAL</div><div id="empresa" class="top-sub"></div></div>
      <div class="top-right">
        <input id="busca" type="search" placeholder="🔍 Consulta rápida (cliente, produto, venda...)" autocomplete="off">
        <div id="usuario" class="user"></div>
        <button class="btn" id="sair-conta" hidden>Sair</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/cadastros.js"></script>
<script src="js/documentos.js"></script>
<script src="js/gestao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
